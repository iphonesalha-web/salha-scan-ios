name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest web app (صالحة سكان)
        run: |
          git clone --depth 1 https://github.com/iphonesalha-web/-salha-scan web
          rm -rf web/.git web/.nojekyll
          du -sh web

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild -project SalhaScan.xcodeproj -target SalhaScan \
            -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | grep -E "error:|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Release-iphoneos/SalhaScan.app
          test -f build/Release-iphoneos/SalhaScan.app/web/index.html
          test -f build/Release-iphoneos/SalhaScan.app/native-bridge.js

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SalhaScan.app Payload/
          zip -qry SalhaScan.ipa Payload
          ls -lh SalhaScan.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" SalhaScan.ipa \
            --title "صالحة سكان v1.0.${{ github.run_number }}" \
            --notes "ملف IPA غير موقّع — وقّعه بشهادتك في ESign ثم ثبّته." \
            --latest
